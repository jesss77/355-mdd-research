project: cmps355-mdd
status: implementation

research_question: Do pathway-level transcriptomic representations improve cross-cohort generalization in MDD classification compared with gene-level representations?

source_registry:
  GSE98793: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE98793
  GSE32280: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE32280
  GSE39653: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE39653

roles:
  development: GSE98793
  external:
    - GSE32280
    - GSE39653

mapping:
  identifier: entrez_gene_id
  annotation_rule: unambiguous_single_entrez_and_symbol
  probe_collapse: median
  shared_gene_count: 16467

preprocessing:
  primary:
    input: deposited_processed_expression
    scaling: standard_scaler
    fit_data: training_only
    external_refit: false

  sensitivity:
    method: reference_quantile_normalization
    reference_data: training_only
    external_refit: false
    followed_by_training_scaling: true
    status: complete

planned_features:
  gene_level_count: 50
  gene_selection_statistic: anova_f_classif
  gene_selection_method: SelectKBest
  gene_selection_fit_data: training_fold_only

  pathway_collection: MSigDB H - Hallmark
  pathway_count: 50
  pathway_scoring: ssGSEA
  pathway_version: 2024.1.Hs
  pathway_gene_id: entrez_gene_id
  pathway_score_used: raw_ES
  pathway_sample_norm_method: rank
  pathway_correl_norm_type: rank
  pathway_weight: 0.25
  pathway_min_size: 15
  pathway_max_size: 500
  pathway_selector: passthrough
  pathway_scaling: standard_scaler
  pathway_scaling_fit_data: training_only

planned_model:
  family: logistic_regression_elastic_net
  solver: saga
  class_weight: null

  selection_data: development_only
  external_data_used_for_tuning: false

  cv_structure:
    outer:
      type: StratifiedKFold
      n_splits: 5
      shuffle: true
      random_state: 42

    inner:
      type: StratifiedKFold
      n_splits: 5
      shuffle: true
      random_state: 43

    selection_metric: roc_auc
    status: frozen

  C_grid:
    - 0.01
    - 0.1
    - 1
    - 10
    - 100

  l1_ratio_grid:
    - 0.1
    - 0.5
    - 0.9

planned_metrics:
  primary: AUROC

  classification_threshold: 0.5

  secondary:
    - F1
    - sensitivity
    - specificity

development_results:
  top_50_gene_model:
    nested_cv:
      auroc_mean: 0.646
      auroc_std: 0.028
      f1_mean: 0.769
      f1_std: 0.025
      sensitivity_mean: 0.899
      sensitivity_std: 0.066
      specificity_mean: 0.124
      specificity_std: 0.149

    final_model:
      best_inner_auroc: 0.6661439842209074
      C: 0.01
      l1_ratio: 0.1
      selected_gene_count: 50

    artifact:
      local_path: outputs/gene_final_model/gene_model.joblib
      git_ignored: true

  pathway_model:
    feature_generation:
      collection: MSigDB_Hallmark
      version: 2024.1.Hs
      identifier: entrez_gene_id
      tool: gseapy_1.3.2
      score: raw_ES
      sample_norm_method: rank
      correl_norm_type: rank
      weight: 0.25
      min_size: 15
      max_size: 500
      pathway_count: 50
      min_genes_present: 27
      median_coverage_pct: 92.05
      per_sample_independence_check_max_diff: 0.0

    nested_cv:
      auroc_mean: 0.5846568047337278
      auroc_std: 0.08912322930499454
      f1_mean: 0.7734707266151245
      f1_std: 0.021591546182785994
      sensitivity_mean: 0.8827692307692308
      sensitivity_std: 0.06281747768701461
      specificity_mean: 0.2012820512820513
      specificity_std: 0.13834871946942523

    final_model:
      best_inner_auroc: 0.6507061143984221
      C: 10.0
      l1_ratio: 0.9
      pathway_count: 50
      nonzero_pathways: 50

    artifact:
      committed_model: false
      reproducible_from_frozen_settings: true

    interpretation: >
      The pathway representation had a lower mean development AUROC than the
      primary top-50 gene representation and greater fold-to-fold variability.
      This internal result does not answer the primary research question,
      which depends on frozen external evaluation.

  all_shared_genes_baseline:
    nested_cv:
      auroc_mean: 0.644
      auroc_std: 0.043
      f1_mean: 0.695
      f1_std: 0.039
      sensitivity_mean: 0.678
      sensitivity_std: 0.110
      specificity_mean: 0.469
      specificity_std: 0.211

    final_model:
      best_inner_auroc: 0.698
      C: 10
      l1_ratio: 0.1
      gene_count: 16467

    artifact:
      local_path: outputs/all_genes_baseline/all_genes_model.joblib
      git_ignored: true

  reference_quantile_sensitivity:
    nested_cv:
      auroc_mean: 0.632
      auroc_std: 0.054
      f1_mean: 0.784
      f1_std: 0.031
      sensitivity_mean: 0.929
      sensitivity_std: 0.082
      specificity_mean: 0.124
      specificity_std: 0.116

    final_model:
      best_inner_auroc: 0.645
      C: 0.1
      l1_ratio: 0.9
      selected_gene_count: 50

    artifact:
      local_path: outputs/gene_sensitivity_qn/final_model/gene_model.joblib
      git_ignored: true

    interpretation: >
      Reference quantile normalization did not produce an observed improvement
      in development AUROC relative to the predefined primary top-50 gene
      analysis. This sensitivity result is development-only and does not
      establish external superiority of either preprocessing strategy.

status_notes: >
  Dataset preparation, sample selection, shared-gene mapping, expression QC,
  preprocessing provenance checks, leakage-safe scaling, top-50 ANOVA gene
  selection, nested 5x5 gene-model selection, final top-50 gene fitting, the
  all-shared-genes secondary baseline, the reference-quantile-normalization
  sensitivity analysis, Hallmark ssGSEA feature generation, pathway nested
  cross-validation, and final pathway-model selection are complete for
  GSE98793. The gene and pathway development configurations are now frozen.
  External cohorts have not been used for supervised feature selection,
  hyperparameter tuning, model fitting, or preprocessing-parameter estimation.
  The remaining primary experiment is frozen external evaluation of the gene
  and pathway representations on GSE32280 and GSE39653.